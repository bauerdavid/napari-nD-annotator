# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: tests

on:
  push:
    branches:
      - main
      - npe2
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
      - npe2
  workflow_dispatch:

jobs:
# the build_wheels_macos job is from scikit-image under BSD-3-Clause license:
# https://github.com/scikit-image/scikit-image/blob/main/.github/workflows/wheels_recipe.yml
  build_wheels_macos:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.cibw_arch }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            cibw_arch: x86_64
          - os: macos-15
            cibw_arch: arm64
        
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel

      - name: Install LLVM and OpenMP via Homebrew
        run: |
          brew install llvm libomp

      - name: Build wheels for CPython Mac OS
        run: |
          if [[ "$CIBW_ARCHS_MACOS" == arm64 ]]; then
              export MACOSX_DEPLOYMENT_TARGET=12.0
              export MACOS_DEPLOYMENT_TARGET=12.0
          else
              export MACOSX_DEPLOYMENT_TARGET=10.9
              export MACOS_DEPLOYMENT_TARGET=10.9
          fi
          
          # Explicitly target Homebrew's LLVM toolchain. It natively handles raw -fopenmp flags
          export CIBW_ENVIRONMENT_MACOS="CC=\$(brew --prefix llvm)/bin/clang \
          CXX=\$(brew --prefix llvm)/bin/clang++ \
          CFLAGS='-I\$(brew --prefix libomp)/include' \
          CXXFLAGS='-I\$(brew --prefix libomp)/include' \
          LDFLAGS='-L\$(brew --prefix libomp)/lib -lomp' \
          MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
          MACOS_DEPLOYMENT_TARGET=$MACOS_DEPLOYMENT_TARGET"
          
          python -m cibuildwheel --output-dir dist
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_arch }}
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_TEST_SKIP: "*-macosx_arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.cibw_arch }}
          path: ./dist/*.whl

  build_wheels_linux:
    name: Build wheels on Linux
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.5
        env:
          CIBW_SKIP: "pp* cp310-*i686 *musllinux* *s390x* *ppc64le*"
          CIBW_CONFIG_SETTINGS: "--only-binary=scipy"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.cibw_arch }}
          path: ./wheelhouse/*.whl

  build_wheels_windows:
    name: Build wheels on Windows
    runs-on: windows-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.5
        env:
          CIBW_SKIP: "cp310-win32 pp*"
          CIBW_CONFIG_SETTINGS: "--only-binary=scipy"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.cibw_arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels_macos, build_wheels_linux, build_wheels_windows, build_sdist]
    runs-on: ubuntu-latest
    # upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    # if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all the wheels into dist/
          pattern: wheels-*
          path: dist
          merge-multiple: true
          
      - uses: actions/download-artifact@v4
        with:
          # ensure sdist is also added
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.5.0
        with:
          password: ${{ secrets.TWINE_API_KEY }}
          skip_existing: true
          # To test: repository_url: https://test.pypi.org/legacy/
