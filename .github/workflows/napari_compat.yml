# Runs the plugin's smoke tests (src/napari_nd_annotator/_tests/test_napari_compat.py) against several
# napari versions, so that a napari release that breaks the plugin shows up here and not in a bug report.
# The viewer is created but never shown; it needs OpenGL, which Mesa provides in software under xvfb.
# Every widget in napari.yaml is also opened with add_plugin_dock_widget, i.e. the way the Plugins menu
# opens it, with the viewer wrapped in napari's PublicOnlyProxy.
#
# The minimal-surface package is not installed here (it has no Linux wheels and needs SimpleITK built from
# source), so the end-to-end Minimal Surface test is skipped; the rest of the Minimal Surface widget is not.

name: napari_compat

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # weekly, to notice new napari releases even when nothing changes here
    - cron: "17 5 * * 1"

jobs:
  napari_compat:
    name: napari ${{ matrix.napari }} (Python ${{ matrix.python }}, ${{ matrix.qt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup.cfg's minimum; older releases cannot work: 0.4.11 cannot import the plugin, and 0.4.18/0.4.19
          # import it but lack the layer-controls layout it builds on (QtLabelsControls.button_grid)
          - napari: "0.5.0"
            python: "3.10"
            qt: PyQt5
            constraints: "numpy<2"
          - napari: "0.5.6"
            python: "3.11"
            qt: PyQt5
            constraints: ""
          # newest napari, whatever that is when the job runs
          - napari: "latest"
            python: "3.13"
            qt: PyQt6
            constraints: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system libraries for Qt, xvfb and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libopengl0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 libxcb-shape0 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: Install napari ${{ matrix.napari }} and the plugin
        env:
          NAPARI: ${{ matrix.napari }}
          EXTRA_CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          python -m pip install --upgrade pip
          # constraints keep the plugin's own requirements from replacing the napari under test
          printf '%b\n' "$EXTRA_CONSTRAINTS" > constraints.txt
          if [ "$NAPARI" = "latest" ]; then NAPARI_SPEC="napari"; else NAPARI_SPEC="napari==$NAPARI"; echo "$NAPARI_SPEC" >> constraints.txt; fi
          python -m pip install -c constraints.txt "$NAPARI_SPEC" ${{ matrix.qt }} pytest
          python -m pip install -c constraints.txt .
          # opencv-python bundles its own Qt platform plugins, which replace PyQt5's and abort the process
          # at the first QApplication; the headless build of the same version has none
          OPENCV_VERSION=$(python -c "import importlib.metadata as m; print(m.version('opencv-python'))")
          python -m pip uninstall -y opencv-python
          python -m pip install -c constraints.txt "opencv-python-headless==$OPENCV_VERSION"
          python -m pip list | grep -i -E "napari|numpy|pydantic|qt|vispy|magic"

      - name: Check that the plugin imports
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          # shows the real error when the plugin cannot be imported (pytest only reports "module not found")
          xvfb-run -a -s "-screen 0 1280x1024x24" python -c "import napari_nd_annotator as p; print('imported', p.__file__)"

      - name: Run the compatibility tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          # run the installed package (not the checkout) so that the wheel contents are tested too
          xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -v -rs --pyargs napari_nd_annotator._tests.test_napari_compat
